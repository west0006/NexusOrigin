# ─── .github/workflows/ci.yml ──────────────────────────────
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.23'

jobs:
  lint-test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: pnpm run typecheck || true
      - name: Test
        run: pnpm run test || true

  lint-test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Lint Token Service
        working-directory: server/token-service
        run: |
          go vet ./...
          go fmt ./...

      - name: Lint Deploy Service
        working-directory: server/deploy-service
        run: |
          go vet ./...
          go fmt ./...

  build-docker:
    needs: [lint-test-node, lint-test-go]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./server/api-gateway
          push: true
          tags: ghcr.io/${{ github.repository }}/api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Token Service
        uses: docker/build-push-action@v6
        with:
          context: ./server/token-service
          push: true
          tags: ghcr.io/${{ github.repository }}/token-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Deploy Service
        uses: docker/build-push-action@v6
        with:
          context: ./server/deploy-service
          push: true
          tags: ghcr.io/${{ github.repository }}/deploy-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max