name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  GO_VERSION: '1.23'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: 'pnpm' }
      - run: pnpm install
      - run: pnpm run lint || true

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./server/api-gateway
          push: true
          tags: ghcr.io/${{ github.repository }}/api-gateway:latest
      - name: Build and push Token Service
        uses: docker/build-push-action@v6
        with:
          context: ./server/token-service
          push: true
          tags: ghcr.io/${{ github.repository }}/token-service:latest
      - name: Build and push Deploy Service
        uses: docker/build-push-action@v6
        with:
          context: ./server/deploy-service
          push: true
          tags: ghcr.io/${{ github.repository }}/deploy-service:latest